[package]
name = "basenc"
version = "1.0.0-alpha.1"
authors = ["Casper <CasualX@users.noreply.github.com>"]
edition = "2024"
rust-version = "1.95"

description = "High-performance SIMD-accelerated Base64, Base32, and hex encoding and decoding with no_std support."
documentation = "https://docs.rs/basenc/"
repository = "https://github.com/CasualX/basenc"
readme = "readme.md"
keywords = ["base64", "base32", "hex", "simd", "no_std"]
categories = ["encoding", "no-std"]
license = "MIT"

[features]
default = ["std", "simd-runtime"]

# Support for the standard library
std = []

# SIMD acceleration
simd-off = [] # Disable SIMD acceleration.
simd-runtime = ["std"] # Enable runtime detection of SIMD support.

[dev-dependencies]
urandom = "1.0.0-alpha.2"
